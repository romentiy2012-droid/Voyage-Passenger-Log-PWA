<style>
  :root{
    --bg:#0f1720;--panel:#16212c;--panel2:#1c2b38;--border:#2a3b49;
    --text:#e6edf3;--muted:#8fa3b3;--accent:#3aa0ff;--accent2:#1f8f5f;
    --danger:#e0555a;--warn:#e0a83a;--ok:#7be0a0;--orlan:#3aa0ff;--berkut:#e0a83a;
    --errt:#ff9b9f;--infot:#8fd3ff;--hlt:#ffe27a;--hlbg:rgba(255,214,0,.2);--ph:#44586a;--hover:rgba(255,255,255,.03);--scheme:dark;
    --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{padding-bottom:60px;}
  header{padding:12px 16px 6px;display:flex;flex-direction:column;gap:10px;}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px;}
  h1 .app-logo{width:34px;height:34px;flex:none;}
  h1 .icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3aa0ff,#1f8f5f);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .subtitle{color:var(--muted);font-size:12.5px;margin-top:-6px;}
  .backup-chip{font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap;}
  .backup-chip.ok{color:var(--ok);border-color:rgba(123,224,160,.35);}
  .backup-chip.warn{color:var(--warn);border-color:rgba(224,168,58,.5);}
  .backup-chip.bad{color:var(--errt);border-color:rgba(224,85,90,.55);}

  nav.views{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;align-self:flex-start;max-width:100%;overflow-x:auto;}
  nav.views button{background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:9px 16px;font-size:14px;font-weight:600;border-radius:9px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s,border-color .15s;}
  nav.views button:hover{color:var(--text);border-color:var(--accent);}
  nav.views button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(58,160,255,.35);}
  nav.views button .vi{font-size:15px;line-height:1;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;align-items:center;}
  .tab{padding:7px 13px;border-radius:20px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:13.5px;white-space:nowrap;cursor:pointer;flex:none;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .tab.tab-add{border-style:dashed;color:var(--ok);}
  .tabs{flex-direction:column;align-items:stretch;gap:7px;overflow-x:visible;}
  .tabs-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tab-year{font-weight:700;letter-spacing:.3px;}
  .tabs-years .tab{padding:6px 16px;}
  .tabs-months .tab{min-width:92px;text-align:center;}
  .sync-chip.ok{color:var(--ok);border-color:rgba(123,224,160,.35);}
  .sync-chip.bad{color:var(--errt);border-color:rgba(224,85,90,.55);}
  .busy{position:fixed;right:18px;bottom:18px;z-index:9998;width:330px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .busy-title{font-weight:700;font-size:13.5px;margin-bottom:8px;color:var(--text);}
  .busy-bar{height:12px;border-radius:7px;background:var(--bg);border:1px solid var(--border);overflow:hidden;}
  .busy-fill{height:100%;width:0;background:var(--accent);transition:width .2s;}
  .busy-fill.run{width:35%;animation:busyRun 1.1s ease-in-out infinite;}
  @keyframes busyRun{0%{margin-left:-35%}100%{margin-left:100%}}
  .busy-text{font-size:12px;color:var(--muted);margin-top:7px;min-height:16px;word-break:break-word;}
  .busy.ok .busy-fill{background:var(--ok);}
  .busy.ok .busy-title{color:var(--ok);}
  .busy.bad .busy-fill{background:var(--errt);}
  .busy.bad .busy-title{color:var(--errt);}
  .rep-all{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;}
  .rep-addr{font-size:12px;color:var(--muted);line-height:1.9;margin:2px 0 8px;}
  .addr-line{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:3px;}
  .addr-lbl{font-weight:700;color:var(--text);min-width:52px;}
  .addr-chip{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:2px 4px 2px 9px;display:inline-flex;align-items:center;gap:4px;font-size:12px;}
  .addr-chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:2px 4px;border-radius:8px;}
  .addr-chip button:hover{background:rgba(224,85,90,.18);color:var(--errt);}
  .addr-add{background:none;border:1px dashed var(--border);color:var(--accent);border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer;}
  .addr-add:hover{border-color:var(--accent);}
  .addr-empty{font-style:italic;opacity:.6;}
  .addr-new{display:inline-flex;gap:5px;align-items:center;}
  .tab-empty{opacity:.45;}
  .tab-empty:hover{opacity:.8;}
  .tab-month-input{background:var(--panel);border:1px solid var(--border);border-radius:20px;color:var(--muted);padding:6px 10px;font-size:13px;font-family:inherit;flex:none;color-scheme:var(--scheme);}

  main{padding:0 16px;}
  .view[hidden]{display:none;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:12px 0;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;}
  .stat .label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;}
  .stat .value{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
  .stat .sub{color:var(--muted);font-size:11px;margin-top:1px;}
  .stat.orlan .value{color:var(--orlan);} .stat.berkut .value{color:var(--berkut);} .stat.total .value{color:var(--ok);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px;flex-wrap:wrap;}
  .toolbar .left,.toolbar .right{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .search{background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13.5px;font-family:inherit;min-width:220px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:600;transition:filter .15s ease,transform .05s ease;}
  button:active{transform:scale(.97);}
  button:hover{filter:brightness(1.1);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-danger{background:rgba(224,85,90,.15);color:var(--danger);border:1px solid rgba(224,85,90,.35);}
  .btn-small{padding:6px 10px;font-size:12px;}
  .btn-icon{padding:6px 9px;font-size:13px;}

  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);}
  thead th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:7px 6px;border:1px solid var(--border);position:sticky;top:0;z-index:5;}
  th.group{text-align:center;}
  th.o{color:var(--orlan);} th.b{color:var(--berkut);}
  tbody td{padding:7px 6px;border:1px solid var(--border);vertical-align:top;}
  tbody tr.rec{cursor:pointer;}
  tbody tr.rec:hover{background:var(--hover);}
  tbody tr.cancelled td{color:var(--muted);}
  tbody tr.cancelled td.num{text-decoration:line-through;}
  tbody tr.total-row td{font-weight:700;background:var(--panel2);color:var(--text);}
  tbody tr.day-sep td{padding:0;border:none;height:2px;background:var(--border);}
  td.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;}
  td.day-cell{font-weight:700;color:var(--muted);white-space:nowrap;}
  td.t-cell{white-space:nowrap;}
  td.note-cell{color:var(--muted);font-size:12px;min-width:200px;max-width:360px;white-space:pre-wrap;}
  td.total-cell{font-weight:700;color:var(--ok);}
  .flight-no{font-weight:600;white-space:nowrap;}
  .route{color:var(--muted);font-size:11.5px;white-space:nowrap;}
  .badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px;}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--border);color:var(--text);background:var(--panel2);white-space:nowrap;}
  .badge.cancel{color:var(--errt);border-color:rgba(224,85,90,.45);}
  .badge.fuel{color:var(--infot);border-color:rgba(58,160,255,.4);}
  .badge.event{color:var(--muted);}
  .badge.to-ORL{border-color:rgba(58,160,255,.5);} .badge.to-BER{border-color:rgba(224,168,58,.55);}
  .tr-cell{font-size:12px;white-space:nowrap;line-height:1.5;}
  .empty-state{text-align:center;color:var(--muted);padding:36px 20px;background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);}
  .hint{color:var(--muted);font-size:12.5px;margin:6px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.modal-overlay{align-items:center;}}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:620px;max-height:94vh;overflow-y:auto;padding:18px 18px 22px;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal h2{margin:0 0 12px;font-size:16px;}
  .field{margin-bottom:10px;min-width:0;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input,.field textarea,.field select,.inline-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 9px;font-size:14px;font-family:inherit;color-scheme:var(--scheme);}
  .field textarea{resize:vertical;min-height:44px;}
  .field input[readonly]{color:var(--muted);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:480px){.row4{grid-template-columns:1fr 1fr;}}
  .fgt{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);margin:14px 0 8px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;}
  .seg button{flex:1;background:transparent;color:var(--muted);padding:7px 8px;font-size:13px;border-radius:6px;}
  .seg button.on{background:var(--panel2);color:var(--text);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .chip{background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:14px;font-size:12.5px;font-weight:600;}
  .chip.on{border-color:var(--accent);color:var(--text);}
  .list-row{display:grid;gap:6px;margin-bottom:6px;align-items:center;}
  .cont-row{grid-template-columns:1.3fr 1fr .8fr auto;}
  .fuel-row{grid-template-columns:1fr .8fr 1.5fr auto;}
  .inline-input{padding:7px 8px;font-size:13.5px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;}
  .src-note{background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:8px 10px;color:var(--muted);font-size:12.5px;white-space:pre-wrap;}
  .form-error{color:var(--errt);font-size:13px;min-height:1em;margin:6px 0 0;}
  .form-warn{color:var(--warn);font-size:12.5px;margin:4px 0 0;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:12px 0;}
  .panel h3{margin:0 0 10px;font-size:14px;}
  .panel p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.45;}
  .panel .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;}
  .kv span:nth-child(odd){color:var(--muted);}
  .report-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .report-controls .field{margin:0;}
  .chart{width:100%;overflow-x:auto;}
  .chart svg{display:block;min-width:420px;}
  .legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin:4px 0 8px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.orlan{background:var(--orlan);} .dot.berkut{background:var(--berkut);} .dot.tr{background:var(--ok);}

  .app-notice{margin:10px 0;padding:11px 12px;background:var(--panel2);border:1px solid var(--warn);border-radius:8px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .app-notice.err{border-color:var(--danger);}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px 16px 6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:92vw;text-align:center;}
  .toast.show{opacity:1;}
  input[type=file]{display:none;}
  mark{background:rgba(224,168,58,.35);color:inherit;border-radius:2px;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .from-fuel{color:var(--infot);white-space:nowrap;}
  .diff-mark{color:var(--warn);font-weight:700;}
  .fuel-btn{background:rgba(58,160,255,.1);border:1px solid rgba(58,160,255,.35);color:var(--text);padding:3px 8px;font-size:12.5px;font-weight:700;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .fuel-btn.partial{border-style:dashed;color:var(--warn);}
  .fuel-btn .caret{color:var(--muted);font-weight:400;}
  tr.legs-row td{background:var(--bg);padding:8px 10px;}
  .legs-head{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .legs-head b{color:var(--text);}
  table.legs-table{background:transparent;font-size:12.5px;width:auto;min-width:420px;}
  table.legs-table th{position:static;font-size:10.5px;}
  table.legs-table td{padding:4px 10px;border:1px solid var(--border);}
  table.legs-table tr.stay td{color:var(--muted);}
  .pending{color:var(--warn);font-size:12px;}
  tr.ghost td{color:var(--muted);background:rgba(58,160,255,.03);font-style:italic;}
  tr.ghost td .btn-small{font-style:normal;}
  .fuel-hint{background:var(--bg);border:1px solid rgba(58,160,255,.35);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;}
  .fuel-hint b{color:var(--text);}
  /* ---- карточка рейса ---- */
  .card-overlay{align-items:center;}
  .card-modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:calc(100vw - 16px);height:calc(100vh - 16px);display:flex;flex-direction:column;overflow:hidden;}
  .card-head{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .card-title{display:flex;align-items:center;gap:8px;}

           gruz:0, cont:0, contORL:0, contBER:0, FW:0, DO:0};
  list.forEach(function(r){

    ["npOrlan","npBerkut","pnOrlan","pnBerkut","trO2B","trB2O","trUnk","gruz"].forEach(function(f){ t[f] += num(r[f]); });
    t.cont += r.containers.length;

var busyOpen = 0;

  box.innerHTML = '<div class="busy-title"></div><div class="busy-bar"><div class="busy-fill run"></div></div><div class="busy-text"></div>';

  try{ out = fn(b); }catch(e){ b.fail(e && e.message || String(e)); throw e; }

  var now = Date.now(), old = Object.create(null);
  if(state.data && state.data.records) state.data.records.forEach(function(r){ old[r.id] = r; });
  var live = Object.create(null);
  v.records.forEach(function(r){
    live[r.id] = true;
    var o = old[r.id];
    if(!o){ r.upd = now; return; }
    var a = JSON.stringify(cmpView(r)), b = JSON.stringify(cmpView(o));
    r.upd = a === b ? (o.upd || now) : now;
  });
  if(state.data && state.data.records) state.data.records.forEach(function(r){ if(!live[r.id]) v.deleted[r.id] = now; });
  Object.keys(v.deleted).forEach(function(id){ if(live[id]) delete v.deleted[id]; });

var dirHandle = null, dirState = "unsupported", autoTimer = null;
function idb(){ return new Promise(function(res, rej){
  if(!window.indexedDB) return rej(new Error("IndexedDB недоступен"));
  var q = indexedDB.open("pax-log", 1);
  q.onupgradeneeded = function(){ q.result.createObjectStore("kv"); };
  q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ rej(q.error); };
}); }
function idbDo(mode, fn){ return idb().then(function(db){ return new Promise(function(res, rej){
  var tx = db.transaction("kv", mode), st = tx.objectStore("kv"), q = fn(st);
  tx.oncomplete = function(){ res(q && q.result); }; tx.onerror = function(){ rej(tx.error); };
}); }); }
var BK_PATH_KEY = "pax-backup-path", bkPath = null;
function deskIO(){ var d = window.paxDesktop; return (d && typeof d.pickDir === "function" && typeof d.writeFile === "function") ? d : null; }
function deskJoin(dir, name){ return String(dir).replace(/[\\\/]+$/, "") + "\\" + name; }
function initBackupDir(){
  if(deskIO()){
    try{ bkPath = sget(BK_PATH_KEY) || null; }catch(e){ bkPath = null; }
    dirState = bkPath ? "ok" : "none";
    return Promise.resolve();
  }
  if(!window.showDirectoryPicker || !window.indexedDB){ dirState = "unsupported"; return Promise.resolve(); }
  dirState = "none";
  return idbDo("readonly", function(st){ return st.get("backupDir"); }).then(function(h){
    if(!h) return;
    dirHandle = h;
    return h.queryPermission({mode:"readwrite"}).then(function(p){ dirState = p === "granted" ? "ok" : "need-permission"; });
  }).catch(function(){ dirState = "none"; });
}
function pickBackupDir(){
  var d = deskIO();
  if(d){
    return d.pickDir({title:"Папка для автокопий журнала", defaultPath: bkPath || ""}).then(function(p){
      if(!p) return;
      bkPath = p; try{ sset(BK_PATH_KEY, p); }catch(e){}
      dirState = "ok";
      return writeAutoBackup().then(function(ok){ toast(ok ? "Папка выбрана, копия записана" : "Папка выбрана, но записать копию не вышло"); renderAll(); });
    }).catch(function(e){ notice("Не удалось выбрать папку: " + (e && e.message || e), true); });
  }
  window.showDirectoryPicker({id:"pax-log-backup", mode:"readwrite"}).then(function(h){
    dirHandle = h; dirState = "ok";
    return idbDo("readwrite", function(st){ return st.put(h, "backupDir"); }).then(function(){ return writeAutoBackup(); });
  }).then(function(ok){ if(ok) toast("Папка для автокопий выбрана, копия записана"); renderAll(); })
    .catch(function(e){ if(e && e.name === "AbortError") return; notice("Не удалось выбрать папку: " + (e && e.message || e) + " В этом окне браузер может запрещать доступ к папкам — откройте журнал как приложение.", true); });
}
function resumeBackupDir(){
  if(!dirHandle) return;
  dirHandle.requestPermission({mode:"readwrite"}).then(function(p){
    dirState = p === "granted" ? "ok" : "need-permission";
    if(dirState === "ok") return writeAutoBackup().then(function(){ toast("Автокопия возобновлена"); });
  }).catch(function(e){ notice("Нет доступа к папке: " + e.message, true); }).then(renderAll);
}
function forgetBackupDir(){
  if(deskIO()){ bkPath = null; try{ sset(BK_PATH_KEY, ""); }catch(e){} dirState = "none"; renderAll(); return; }
  idbDo("readwrite", function(st){ return st.delete("backupDir"); }).catch(function(){});
  dirHandle = null; dirState = window.showDirectoryPicker ? "none" : "unsupported"; renderAll();
}
function writeFile(dir, name, text){
  return dir.getFileHandle(name, {create:true}).then(function(fh){ return fh.createWritable(); })
    .then(function(w){ return w.write(text).then(function(){ return w.close(); }); });
}
function writeDeskFile(d, dir, name, text){
  return d.writeFile(deskJoin(dir, name), new TextEncoder().encode(text)).then(function(r){
    if(!r || !r.ok) throw new Error((r && r.error) || "не удалось записать " + name);
  });
}
function writeAutoBackup(){
  var text;
  var d = deskIO();
  if(d){
    if(dirState !== "ok" || !bkPath) return Promise.resolve(false);
    text = JSON.stringify(state.data, null, 1);
    return writeDeskFile(d, bkPath, "Журнал_" + todayISO() + ".json", text)
      .then(function(){ return writeDeskFile(d, bkPath, "Журнал_последний.json", text); })
      .then(function(){ meta.lastBackupAt = Date.now(); meta.lastBackupHow = "автокопия в папку"; meta.lastAutoError = ""; saveMeta(); renderBanner(); return true; })
      .catch(function(e){ meta.lastAutoError = e.message || String(e); saveMeta(); renderBanner(); return false; });
  }
  if(dirState !== "ok" || !dirHandle) return Promise.resolve(false);
  text = JSON.stringify(state.data, null, 1);
  return writeFile(dirHandle, "Журнал_" + todayISO() + ".json", text)
    .then(function(){ return writeFile(dirHandle, "Журнал_последний.json", text); })
    .then(function(){ meta.lastBackupAt = Date.now(); meta.lastBackupHow = "автокопия в папку"; meta.lastAutoError = ""; saveMeta(); renderBanner(); return true; })
    .catch(function(e){ meta.lastAutoError = e.message || String(e); dirState = "need-permission"; saveMeta(); renderBanner(); return false; });
}
function scheduleAutoBackup(){ clearTimeout(autoTimer); autoTimer = setTimeout(writeAutoBackup, 1200); }

/* ============ Файлы ============ */
function download(blobOrText, type, name){
  var blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], {type:type});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
function exportJson(){
  download(JSON.stringify(state.data, null, 1), "application/json", "Журнал_" + todayISO() + ".json");
  meta.lastBackupAt = Date.now(); meta.lastBackupHow = "скачан JSON"; saveMeta(); renderBanner();
  toast("Копия журнала скачана");
}
function exportPrevious(){
  var raw = sget(PREV_KEY);
  if(!raw){ toast("Предыдущей копии пока нет"); return; }
  download(raw, "application/json", "Журнал_предыдущая_" + todayISO() + ".json");
}
function exportLegacy(){
  var raw = sget(LEGACY_KEY);
  if(!raw){ toast("Старой версии журнала в этом браузере нет"); return; }
  download(raw, "application/json", "Журнал_старая_версия_v2.json");
}
function monthRecords(mk){ return state.data.records.filter(function(r){ return monthKey(r.date) === mk; }); }
function exportMonthXlsx(){
  var list = monthRecords(state.month);
  download(buildXlsx([journalSheet(list, monthLabel(state.month))]), null, "УЧЕТ_PAX_" + monthLabel(state.month).replace(" ", "_") + ".xlsx");
}
function exportMonthCsv(){

}

/* ============ Журнал ============ */
function extraMonths(){ try{ var x = JSON.parse(sget("pax-log-extra-months") || "[]"); return Array.isArray(x) ? x.filter(function(m){ return /^\d{4}-\d{2}$/.test(m); }) : []; }catch(e){ return []; } }
function monthList(){
  var set = {}; state.data.records.forEach(function(r){ set[monthKey(r.date)] = 1; });
  extraMonths().forEach(function(m){ set[m] = 1; });
  set[todayISO().slice(0,7)] = 1;
  if(state.month) set[state.month] = 1;
  return Object.keys(set).sort();
}
function yearList(){
  var set = {};
  state.data.records.forEach(function(r){ set[r.date.slice(0, 4)] = 1; });
  extraMonths().forEach(function(m){ set[m.slice(0, 4)] = 1; });
  set[todayISO().slice(0, 4)] = 1;
  if(state.month) set[state.month.slice(0, 4)] = 1;
  return Object.keys(set).sort();
}
function monthsWithData(){
  var set = {}; state.data.records.forEach(function(r){ set[monthKey(r.date)] = 1; });
  return set;
}
function goMonth(mk){
  state.month = mk; state.search = "";
  var si = document.getElementById("searchInput"); if(si) si.value = "";
  renderJournal();
}
function rememberMonth(mk){
  var ex = extraMonths();
  if(ex.indexOf(mk) < 0){ ex.push(mk); try{ sset("pax-log-extra-months", JSON.stringify(ex)); }catch(e){} }
}
function renderTabs(){
  var el = document.getElementById("monthTabs"); el.innerHTML = "";
  var cur = state.month || todayISO().slice(0, 7);
  var cy = cur.slice(0, 4);
  var years = yearList();
  if(years.indexOf(cy) < 0){ years.push(cy); years.sort(); }
  var has = monthsWithData();

  var rowY = document.createElement("div"); rowY.className = "tabs-row tabs-years";
  years.forEach(function(y){
    var b = document.createElement("button");
    b.className = "tab tab-year" + (y === cy ? " active" : "");
    b.textContent = y;
    b.onclick = function(){
      if(y === cy) return;
      var inY = Object.keys(has).filter(function(mk){ return mk.slice(0, 4) === y; }).sort();
      var t = todayISO();
      goMonth(y === t.slice(0, 4) ? t.slice(0, 7) : (inY.length ? inY[inY.length - 1] : y + "-01"));
    };
    rowY.appendChild(b);
  });
  var lastY = years[years.length - 1], nextY = String(+lastY + 1);
  if(cy === lastY){
    var ay = document.createElement("button");
    ay.className = "tab tab-add"; ay.textContent = "+ " + nextY;
    ay.title = "Начать " + nextY + " год";
    ay.onclick = function(){ rememberMonth(nextY + "-01"); goMonth(nextY + "-01"); };
    rowY.appendChild(ay);
  }
  el.appendChild(rowY);

  var rowM = document.createElement("div"); rowM.className = "tabs-row tabs-months";
  for(var m = 1; m <= 12; m++){
    var mk = cy + "-" + pad2(m);
    var b2 = document.createElement("button");
    b2.className = "tab" + (mk === cur ? " active" : "") + (has[mk] ? "" : " tab-empty");
    b2.textContent = MONTHS[m - 1];
    b2.title = has[mk] ? "" : "записей нет";
    b2.onclick = (function(k){ return function(){ goMonth(k); }; })(mk);
    rowM.appendChild(b2);
  }
  el.appendChild(rowM);
}
function statsHtml(t, fs, kg){
  function s(label, value, cls, sub){ return '<div class="stat ' + (cls||"") + '"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>'; }
  return s("Всего пассажиров", t.all, "total", "вкл. пересадки " + t.tr) +
    s("Набиль → Поляна", t.np, "", "Орл " + t.npOrlan + " · Бер " + t.npBerkut) +
    s("Поляна → Набиль", t.pn, "", "Орл " + t.pnOrlan + " · Бер " + t.pnBerkut) +
    s("Орлан", t.orlan, "orlan") + s("Беркут", t.berkut, "berkut") +
    s("Пересадки", t.tr, "", "О→Б " + t.trO2B + " · Б→О " + t.trB2O + (t.trUnk ? " · ? " + t.trUnk : "")) +
    s("Рейсы", t.trips) +
    s("Контейнеры", t.cont, "", "Орл " + t.contORL + " · Бер " + t.contBER) +
    (fs && fs.trips ? s("Топливо, т", fmtT(fs.t), "", (fs.trips ? fmtT(fs.t / fs.trips) + " т/рейс" : "") + (kg ? " · " + kg + " кг/пасс" : "") + (fs.pending ? " · неполн. " + fs.pending : "")) : "") +
    (t.FW || t.DO ? s("Бункеровка, т", fmtNum(t.FW + t.DO), "", "FW " + fmtNum(t.FW) + " · DO " + fmtNum(t.DO)) : "");
}
function hl(text, q){
  var e = esc(text);
  if(!q) return e;
  var i = text.toLowerCase().indexOf(q);
  if(i < 0) return e;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
function matches(r, q){
  return [r.no, r.route, r.note, r.srcNote, r.timeRaw, contLabel(r.containers), bunkerLabel(r.bunker), fmtDateFull(r.date)].join(" \n ").toLowerCase().indexOf(q) >= 0;
}
function tableHtml(list, opts){
  var q = opts.q || "";
  var h = '<table><thead><tr><th rowspan="2">Дата</th><th rowspan="2">Время</th><th rowspan="2">Рейс</th>' +
    '<th colspan="3" class="group">Набиль → Поляна</th><th colspan="3" class="group">Поляна → Набиль</th>' +
    '<th rowspan="2">Пере&shy;садки</th><th rowspan="2">Груз</th><th rowspan="2">Итого</th><th rowspan="2">Топливо, т</th><th rowspan="2">Контейнеры, бункеровка, примечание</th></tr>' +
    '<tr><th class="o">Орл</th><th class="b">Бер</th><th>Σ</th><th class="o">Орл</th><th class="b">Бер</th><th>Σ</th></tr></thead><tbody>';
  var prevDate = null;
  list.forEach(function(r){
    if(prevDate && prevDate !== r.date && opts.sep) h += '<tr class="day-sep"><td colspan="15"></td></tr>';
    var np = num(r.npOrlan) + num(r.npBerkut), pn = num(r.pnOrlan) + num(r.pnBerkut);
    var anyNp = !blank(r.npOrlan) || !blank(r.npBerkut), anyPn = !blank(r.pnOrlan) || !blank(r.pnBerkut);
    var tr = [];
    if(!blank(r.trO2B) && r.trO2B) tr.push("О→Б " + r.trO2B);
    if(!blank(r.trB2O) && r.trB2O) tr.push("Б→О " + r.trB2O);
    if(!blank(r.trUnk) && r.trUnk) tr.push('<span title="Направление не указано">? ' + r.trUnk + '</span>');
    var badges = [];
    r.bunker.forEach(function(b){ badges.push('<span class="badge fuel">⛽ ' + hl(bunkerLabel([b]), q) + '</span>'); });
    r.containers.forEach(function(c){ badges.push('<span class="badge to-' + c.to + '">▣ ' + hl(c.no, q) + (c.to ? " → " + VESSELS[c.to] : "") + (c.w !== "" ? " · " + fmtNum(c.w) + " т" : "") + '</span>'); });
    h += '<tr class="rec" data-id="' + r.id + '">' +
      '<td class="day-cell">' + (opts.fullDate ? fmtDateFull(r.date) : (prevDate === r.date ? "" : fmtDate(r.date))) + '</td>' +
      '<td class="t-cell">' + fuelTimeHtml(r) + '</td>' +
      '<td><div class="flight-no">' + hl(r.no, q) + '</div><div class="route">' + hl(r.route, q) + '</div></td>' +
      '<td class="num">' + (blank(r.npOrlan) ? "" : r.npOrlan) + '</td><td class="num">' + (blank(r.npBerkut) ? "" : r.npBerkut) + '</td><td class="num total-cell">' + (anyNp ? np : "") + '</td>' +
      '<td class="num">' + (blank(r.pnOrlan) ? "" : r.pnOrlan) + '</td><td class="num">' + (blank(r.pnBerkut) ? "" : r.pnBerkut) + '</td><td class="num total-cell">' + (anyPn ? pn : "") + '</td>' +
      '<td class="tr-cell">' + tr.join("<br>") + '</td>' +
      '<td class="num">' + (blank(r.gruz) ? "" : fmtNum(r.gruz)) + '</td>' +
      '<td class="num total-cell">' + (recPax(r) || "") + '</td>' +
      '<td class="num">' + fuelCellHtml(fuelOf(r)) + '</td>' +
      '<td class="note-cell">' + (badges.length ? '<div class="badges">' + badges.join("") + '</div>' : "") + hl(r.note, q) + '</td></tr>';
    if(fuelOf(r) && fuelOpen[fuelOf(r).depAt]) h += fuelLegsHtml(fuelOf(r), 15);
    prevDate = r.date;
  });
  (opts.ghosts || []).forEach(function(t){
    h += '<tr class="ghost"><td class="day-cell">' + fmtDate(t.date) + '</td><td class="t-cell"><span class="from-fuel">' + t.dep + "–" + (t.arr || "…") + '</span></td><td><div class="route">' + esc(t.route) + '</div></td>' +
      '<td colspan="9">Есть в журнале расхода, нет в журнале пассажиров</td><td class="num">' + fuelCellHtml(t) + '</td>' +
      '<td>' + (state.readOnly ? "" : '<button class="btn-secondary btn-small" data-newfuel="' + esc(t.depAt) + '">+ Создать запись</button>') + '</td></tr>';
    if(fuelOpen[t.depAt]) h += fuelLegsHtml(t, 15);

  if(opts.total){
    var t = totals(list);
    h += '<tr class="total-row"><td colspan="3">' + esc(opts.totalLabel) + '</td><td class="num">' + t.npOrlan + '</td><td class="num">' + t.npBerkut + '</td><td class="num">' + t.np + '</td>' +
      '<td class="num">' + t.pnOrlan + '</td><td class="num">' + t.pnBerkut + '</td><td class="num">' + t.pn + '</td><td class="num">' + t.tr + '</td>' +

  }

function renderJournal(){
  renderTabs();
  var q = state.search.trim().toLowerCase();
  var list = q ? state.data.records.filter(function(r){ return matches(r, q); }) : monthRecords(state.month);
  var info = document.getElementById("searchInfo");
  info.hidden = !q;
  info.textContent = q ? "Найдено по всему журналу: " + list.length : "";
  buildFuelIndex();
  var mFrom = state.month + "-01", mTo = state.month + "-31";
  var fs = q ? fuelSum(list.map(fuelOf).filter(Boolean)) : fuelSum(fuelTripsIn(mFrom, mTo));
  var ghosts = q ? [] : fuelIdx.unmatched.filter(function(t){ return t.date >= mFrom && t.date <= mTo; });
  document.getElementById("statsBar").innerHTML = statsHtml(totals(list), fs, kgPerPax(list));
  document.getElementById("journalPrintTitle").textContent = "Судовой журнал — " + (q ? "поиск «" + state.search + "»" : monthLabel(state.month));
  var wrap = document.getElementById("journalTableWrap");
  if(!list.length && !ghosts.length){
    wrap.innerHTML = '<div class="empty-state">' + (q ? "Ничего не найдено." : "За " + monthLabel(state.month) + " записей нет. Нажмите «+ Добавить запись».") + '</div>';
  } else {
    wrap.innerHTML = tableHtml(list, {q:q, sep:!q, fullDate:!!q, total:true, ghosts:ghosts, fuelTotal:fs.t, totalLabel: q ? "Итого по найденному" : "Всего за " + monthLabel(state.month)});
    wrap.querySelectorAll("tr.rec").forEach(function(tr){ tr.onclick = function(){ openCard(tr.getAttribute("data-id")); }; });
    bindFuelButtons(wrap);
  }
  document.getElementById("addBtn").disabled = state.readOnly;
}

/* ============ Форма записи ============ */
function nextFlightNo(date, exceptId){
  var mm = date.slice(5,7), mk = monthKey(date), max = 0;
  state.data.records.forEach(function(r){
    if(r.id === exceptId || monthKey(r.date) !== mk) return;
    var m = r.no.match(/^(\d{1,3})-(\d{2})$/);
    if(m && m[2] === mm) max = Math.max(max, +m[1]);
  });
  return pad2(max + 1) + "-" + mm;
}
function lastTrip(beforeDate){
  var list = state.data.records.filter(function(r){ return r.route && r.date <= beforeDate; });
  return list[list.length - 1] || null;
}
function knownContainers(){
  var s = {}; state.data.records.forEach(function(r){ r.containers.forEach(function(c){ s[c.no] = 1; }); });
  return Object.keys(s).sort();
}
function openForm(id, prefillTrip){

    if(prefillTrip) date = prefillTrip.date;
    r = blankRecord(date);
    r.no = nextFlightNo(date);
    var ft = prefillTrip || (fuelIdx ? fuelIdx.unmatched.find(function(t){ return t.date === date; }) : null);
    if(ft){ r.dep = ft.dep; r.arr = ft.arr; r.route = ft.route; }

    '<div id="fFuelHint"></div>' +
    (r.timeRaw ? '<div class="field"><label for="fTimeRaw">Время, как было записано в старом журнале</label><input type="text" id="fTimeRaw" value="' + esc(r.timeRaw) + '"></div>' : '') +
    '<div id="tripBlock">' +
      '<div class="fgt">Рейс <button class="btn-ghost btn-small" id="fCopyLast" type="button">↺ Маршрут как в прошлом рейсе</button></div>' +
      '<div class="row2"><div class="field"><label for="fNo">№ рейса</label><input type="text" id="fNo" placeholder="01-09" value="' + esc(r.no) + '"></div>' +
      '<div class="field"><label for="fRoute">Маршрут</label><input type="text" id="fRoute" placeholder="NAB-ORL-BER" value="' + esc(r.route) + '"></div></div>' +
      '<div class="chips" id="fRouteChips">' + ROUTE_CODES.map(function(c){ return '<button type="button" class="chip" data-c="' + c[0] + '">+ ' + c[1] + '</button>'; }).join("") +

/* ============ Отчёт ============ */
function reportRange(){
  var mode = document.getElementById("repMode").value;
  if(mode === "year"){ var y = document.getElementById("repYear").value; return {from:y+"-01-01", to:y+"-12-31", title:"за " + y + " год"}; }
  if(mode === "month"){ var mk = document.getElementById("repMonth").value || state.month; return {from:mk+"-01", to:mk+"-"+pad2(daysIn(+mk.slice(0,4), +mk.slice(5,7))), title:"за " + monthLabel(mk)}; }
  if(mode === "range"){
    var f = document.getElementById("repFrom").value, t = document.getElementById("repTo").value;
    if(!validDate(f) || !validDate(t)) return {from:"0000", to:"0000", title:"— укажите даты", bad:true};
    if(f > t){ var x = f; f = t; t = x; }
    return {from:f, to:t, title:"с " + fmtDateFull(f) + " по " + fmtDateFull(t)};
  }
  return {from:"0000-00-00", to:"9999-99-99", title:"за весь журнал"};
}
function reportRecords(rg){ return state.data.records.filter(function(r){ return r.date >= rg.from && r.date <= rg.to; }); }
function chartSvg(by){
  var keys = Object.keys(by).sort();
  if(!keys.length) return "";
  var data = keys.map(function(k){ var t = totals(by[k]); return {k:k, o:t.orlan, b:t.berkut, tr:t.tr, all:t.all}; });
  var max = Math.max.apply(null, data.map(function(d){ return d.all; }).concat([1]));
  var W = Math.max(420, keys.length * 70 + 50), H = 220, top = 20, bottom = 34, left = 36, bw = Math.min(40, (W - left - 10) / keys.length * 0.6);
  var step = (W - left - 10) / keys.length, sc = (H - top - bottom) / max;
  var ticks = [0, Math.round(max/2), max];
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="Пассажиры по месяцам">';
  ticks.forEach(function(t){ var y = H - bottom - t*sc; s += '<line x1="' + left + '" x2="' + (W-6) + '" y1="' + y + '" y2="' + y + '" stroke="var(--border)" stroke-dasharray="3 3"/><text x="' + (left-6) + '" y="' + (y+4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + t + '</text>'; });
  data.forEach(function(d, i){
    var x = left + i*step + (step - bw)/2, y = H - bottom;
    [["o","var(--orlan)"],["b","var(--berkut)"],["tr","var(--ok)"]].forEach(function(p){
      var h = d[p[0]] * sc; if(h <= 0) return; y -= h;
      s += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" fill="' + p[1] + '" rx="2"><title>' + monthLabel(d.k) + ': ' + ({o:"Орлан",b:"Беркут",tr:"Пересадки"})[p[0]] + ' ' + d[p[0]] + '</title></rect>';
    });
    s += '<text x="' + (x + bw/2) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">' + d.all + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="' + (H - bottom + 15) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + MONTHS[+d.k.slice(5)-1].slice(0,3) + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="' + (H - bottom + 28) + '" text-anchor="middle" font-size="9.5" fill="var(--muted)">' + d.k.slice(0,4) + '</text>';
  });
  return s + '</svg>';
}

function matchKey(r){ return r.date + "|" + (r.no || (r.dep || r.timeRaw)); }
function importFile(file){
  var rd = new FileReader();
  rd.onload = function(){
    var incoming;
    try{ incoming = anyToV3(JSON.parse(String(rd.result).replace(/^﻿/, ""))); }
    catch(e){ notice("Импорт не выполнен: " + e.message, true); return; }
    var ir = incoming.records;
    var ov = document.createElement("div"); ov.className = "modal-overlay";
    var byId = {}, byKey = {}; state.data.records.forEach(function(r){ byId[r.id] = r; byKey[matchKey(r)] = r; });
    var same = ir.filter(function(r){ return byId[r.id] || byKey[matchKey(r)]; }).length;
    ov.innerHTML = '<div class="modal"><h2>Импорт журнала</h2><div class="kv">' +
      '<span>Файл</span><span>' + esc(file.name) + '</span><span>Записей в файле</span><span>' + ir.length + (ir.length ? " (" + fmtDateFull(ir[0].date) + " — " + fmtDateFull(ir[ir.length-1].date) + ")" : "") + '</span>' +
      '<span>Совпадают с текущими</span><span>' + same + '</span><span>Новых</span><span>' + (ir.length - same) + '</span></div>' +
      '<div class="field" style="margin-top:12px"><label>Как перенести</label><select id="imMode"><option value="merge">Объединить: новые добавить, совпадающие заменить из файла</option><option value="replace">Заменить журнал полностью</option></select></div>' +
      '<p class="hint">Текущий журнал до импорта сохранится как «предыдущая версия».</p><p class="form-error" id="imErr"></p>' +
      '<div class="modal-actions"><button class="btn-ghost" id="imCancel">Отмена</button><button class="btn-primary" id="imApply">Применить</button></div></div>';
    document.body.appendChild(ov);
    document.getElementById("imCancel").onclick = function(){ ov.remove(); };
    document.getElementById("imApply").onclick = function(){
      var next;
      if(document.getElementById("imMode").value === "replace") next = incoming;
      else {
        next = clone(state.data);
        ir.forEach(function(r){
          var i = next.records.findIndex(function(x){ return x.id === r.id; });
          if(i < 0) i = next.records.findIndex(function(x){ return matchKey(x) === matchKey(r); });
          if(i >= 0){ r.id = next.records[i].id; next.records[i] = r; } else next.records.push(r);
        });
      }
      if(commit(next, "Импорт выполнен")) ov.remove(); else document.getElementById("imErr").textContent = "Не выполнено — см. сообщение вверху.";
    };
  };
  rd.onerror = function(){ notice("Не удалось прочитать файл.", true); };
  rd.readAsText(file);
}

var UPD_URL_KEY = "pax-update-url", UPD_SEEN_KEY = "pax-update-checked";
var UPD_DEFAULT = "https://drive.google.com/drive/folders/10KIs8MVK9bWWCx4NYyttyGS-JQLD6eec";
function updUrl(){ try{ return sget(UPD_URL_KEY) || UPD_DEFAULT; }catch(e){ return UPD_DEFAULT; } }
function updStateText(){
  try{ var t = +sget(UPD_SEEN_KEY) || 0; return t ? "последняя проверка: " + fmtStamp(t) : "ещё не проверяли"; }catch(e){ return ""; }
}
function updCheck(manual){
  var d = window.paxDesktop;
  if(!d || !d.checkUpdate) return;
  var st = document.getElementById("updState");
  if(st) st.textContent = "проверяю… (при плохой связи до минуты — повторяю попытки)";
  var B = busy("Проверка обновлений");
  B.step("связываюсь с папкой обновлений…");
  return d.checkUpdate(updUrl()).then(function(r){
    B.step("на сервере " + r.version + ", у вас " + (r.current || "?"), 70);
    try{ sset(UPD_SEEN_KEY, String(Date.now())); }catch(e){}
    if(st) st.textContent = "последняя проверка: сейчас · на сервере " + r.version + ", у вас " + (r.current || "?");
    if(cmpPaxVer(r.version, r.current) > 0){
      if(confirm("Доступна версия " + r.version + " (у вас " + (r.current || "?") + ").\nОбновить сейчас? Программа перезапустится, данные не тронутся.")){
        B.step("устанавливаю версию " + r.version + "…", 85);
        return d.installUpdate(r.file).then(function(res){
          B.done("установлена версия " + r.version);
          if(res && res.ok && res.shell) alert("Обновилась и оболочка программы (версия " + res.shell + ").\nЗакройте программу и запустите заново — иначе новая оболочка не заработает.");
          return res;
        });
      }
      B.close();
    } else { B.done("у вас последняя версия (" + (r.current || "?") + ")"); if(manual) toast("У вас последняя версия (" + (r.current || "?") + ")"); }
  }).catch(function(e){
    var m = e && e.message || String(e);
    m = m.replace(/^Error invoking remote method '[^']*':\s*/, "").replace(/^Error:\s*/, "");
    if(st) st.textContent = "не получилось: " + m;
    B.fail(m);
    if(manual) notice("Проверка обновлений: " + m, true);
  });
}
function cmpPaxVer(a, b){
  var pa = String(a || "0").split("."), pb = String(b || "0").split(".");
  for(var i = 0; i < Math.max(pa.length, pb.length); i++){ var d = (+pa[i] || 0) - (+pb[i] || 0); if(d) return d; }
  return 0;
}
var CLOCK_DAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
function startClock(){
  var d1 = document.getElementById("clockDate"), t1 = document.getElementById("clockTime");
  if(!d1 || !t1) return;
  function tick(){
    var d = new Date();
    d1.textContent = CLOCK_DAYS[d.getDay()] + ", " + pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear();
    t1.innerHTML = pad2(d.getHours()) + '<span class="cs">:</span>' + pad2(d.getMinutes()) + '<span class="cs">:</span>' + pad2(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
}

function fmtT(v){ return (Math.round(v * 1000) / 1000).toFixed(3).replace(".", ","); }
function fmtStamp(ms){ if(!ms) return "—"; var d = new Date(ms); return pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }

/* Сопоставление: n-й рейс из файла за дату ↔ n-я запись журнала за ту же дату */
function buildFuelIndex(){
  var byDate = {}, byId = {}, used = {};
  var src = fuelTripsSource();
  src.forEach(function(t, i){ (byDate[t.date] = byDate[t.date] || []).push(i); });
  var recByDate = {};
  state.data.records.forEach(function(r){ (recByDate[r.date] = recByDate[r.date] || []).push(r); });
  Object.keys(recByDate).forEach(function(d){
    var ts = byDate[d] || [];
    recByDate[d].forEach(function(r, k){ if(k < ts.length){ byId[r.id] = src[ts[k]]; used[ts[k]] = true; } });
  });
  fuelIdx = {byId:byId, unmatched: src.filter(function(t, i){ return !used[i]; })};
}
function fuelOf(r){ if(!fuelIdx) buildFuelIndex(); return fuelIdx.byId[r.id] || null; }
function fuelTripsIn(from, to){ return fuelTripsSource().filter(function(t){ return t.date >= from && t.date <= to; }); }
function fuelSum(trips){
  var s = {t:0, trips:trips.length, complete:0, pending:0};
  trips.forEach(function(t){ s.t += t.fuel; if(t.complete && !t.pending) s.complete++; else s.pending++; });
  s.t = Math.round(s.t * 1000) / 1000;
  return s;
}
function kgPerPax(records){
  var f = 0, p = 0;
  records.forEach(function(r){ var t = fuelOf(r); if(t && t.complete && !t.pending && recPax(r) > 0){ f += t.fuel; p += recPax(r); } });
  return p ? Math.round(f * 1000 / p) : null;
}

  var diff = own && own !== fileT;
  return '<span class="from-fuel" title="Время из журнала расхода' + (diff ? ". В записи журнала: " + esc(own) : "") + '">' + fileT + (diff ? ' <span class="diff-mark">≠</span>' : '') + '</span>' +
    (t.minutes ? '<div class="route">' + durText(t.minutes) + '</div>' : '');
}
function hlTime(r){ return esc(timeLabel(r)); }
function fuelCellHtml(t){

/* ---- чтение файла ---- */
function applyFuelParse(res, file){
  fuel.trips = res.trips; fuel.points = res.points; fuel.lastPoint = res.lastPoint ? {label:res.lastPoint.label, at:res.lastPoint.at, t:res.lastPoint.t} : null;
  fuel.name = file.name; fuel.lastModified = file.lastModified; fuel.readAt = Date.now(); fuel.error = "";
  fuelIdx = null; saveFuelCache();
}
function readFuelFile(file, force){
  if(!force && file.lastModified === fuel.lastModified && file.name === fuel.name && fuel.trips.length){ fuel.readAt = Date.now(); saveFuelCache(); return Promise.resolve(false); }
  return file.arrayBuffer().then(parseFuelWorkbook).then(function(res){ applyFuelParse(res, file); return true; });
}
function refreshFuel(force){
  var dfs = deskFS();
  if(dfs && fuelPath){
    if(fuelBusy) return Promise.resolve();
    fuelBusy = true;
    return dfs.readFile(fuelPath).then(function(r){ return readFuelFile(fileFromDesk(r), force); }).then(function(changed){
      fuel.state = "ok"; fuel.via = "path"; fuel.error = "";
      if(changed) toast("Журнал расхода обновлён");
    }).catch(function(e){
      fuel.error = "Файл по пути " + fuelPath + " не прочитан: " + (e && e.message || e);
    }).then(function(){ fuelBusy = false; renderAll(); });
  }
  if(fuelBusy || !fuelHandle || fuel.state === "need-permission") return Promise.resolve();
  fuelBusy = true;
  return fuelHandle.queryPermission({mode:"read"}).then(function(p){
    if(p !== "granted"){ fuel.state = "need-permission"; return; }
    return fuelHandle.getFile().then(function(f){ return readFuelFile(f, force); }).then(function(changed){
      fuel.state = "ok";
      if(changed) toast("Журнал расхода обновлён");
    });
  }).catch(function(e){
    fuel.error = (e && e.name === "NotReadableError") ? "Файл сейчас занят или недоступен (сеть?). Повторю позже." : (e && e.message || String(e));
    if(e && e.name === "NotFoundError") fuel.error = "Файл не найден — его переместили или переименовали. Подключите заново.";
  }).then(function(){ fuelBusy = false; renderAll(); });
}
var fuelPicking = false;
function connectFuel(){
  if(deskFS()) return connectFuelPath();
  if(!fuelSupported()){ document.getElementById("fuelFileInput").click(); return; }
  if(fuelPicking){ notice("Окно выбора файла уже открыто — найдите его на панели задач или закройте и нажмите ещё раз.", true); return; }
  fuelPicking = true;
  window.showOpenFilePicker({id:"pax-fuel-xlsx", multiple:false, types:[{description:"Excel", accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx",".xlsm"]}}]})
    .then(function(hs){
      var h = hs[0];
      return h.getFile().then(function(f){ return readFuelFile(f, true); }).then(function(){
        fuelHandle = h; fuel.state = "ok"; fuel.via = "handle";
        return idbDo("readwrite", function(st){ return st.put(h, "fuelFile"); })
          .then(function(){ return idbDo("readonly", function(st){ return st.get("fuelFile"); }); })
          .then(function(saved){ fuel.saved = !!saved; if(!saved) notice("Файл прочитан, но программа не смогла его запомнить — после перезапуска придётся подключать заново.", true); },
                function(e){ fuel.saved = false; notice("Файл прочитан, но не запомнился: " + (e && e.message || e), true); });
      });
    }).then(function(){ fuelPicking = false; toast("Файл расхода подключён: рейсов " + fuel.trips.length); startFuelTimer(); renderAll(); })
    .catch(function(e){
      var m = e && e.message || String(e);
      if(e && e.name === "AbortError") return;
      if(/picker already active/i.test(m)) m = "окно выбора файла уже открыто. Найдите его на панели задач и закройте, а если окна не видно — закройте и запустите программу заново.";
      else if(e && e.name === "SecurityError") m += " В этом окне браузер запрещает доступ к файлам — откройте журнал в Chrome или Edge как обычную страницу.";
      notice("Не удалось подключить файл: " + m, true);
    })
    .then(function(){ fuelPicking = false; }, function(){ fuelPicking = false; });
}
function allowFuel(){
  if(!fuelHandle) return connectFuel();
  fuelHandle.requestPermission({mode:"read"}).then(function(p){
    if(p === "granted"){ fuel.state = "ok"; startFuelTimer(); return refreshFuel(true); }
    notice("Доступ к файлу расхода не выдан.", true);
  }).catch(function(e){ notice("Нет доступа к файлу: " + e.message, true); }).then(renderAll);
}
function disconnectFuel(){
  if(!confirm("Отключить файл расхода? Данные о топливе пропадут из журнала до нового подключения.")) return;
  idbDo("readwrite", function(st){ return st.delete("fuelFile"); }).catch(function(){});
  fuelPath = null; try{ localStorage.removeItem(FUEL_PATH_KEY); }catch(e){}
  fuelHandle = null; fuel = {state:"none", name:"", lastModified:0, readAt:0, trips:[], points:0, lastPoint:null, error:"", via:""};
  fuelIdx = null; try{ localStorage.removeItem(FUEL_CACHE_KEY); }catch(e){}
  clearInterval(fuelTimer); renderAll();
}
function startFuelTimer(){ clearInterval(fuelTimer); fuelTimer = setInterval(function(){ refreshFuel(false); }, 120000); }
function initFuel(){
  var inp = document.getElementById("fuelFileInput");
  inp.onchange = function(e){
    var f = e.target.files[0]; e.target.value = ""; if(!f) return;
    readFuelFile(f, true).then(function(){ fuel.state = "once"; fuel.via = "once"; toast("Прочитано рейсов: " + fuel.trips.length); renderAll(); })
      .catch(function(err){ notice("Не удалось прочитать файл: " + err.message, true); });
  };
  if(deskFS()){
    if(fuelPath){ fuel.via = "path"; fuel.state = "ok"; startFuelTimer(); return refreshFuel(false); }
    fuel.state = fuel.trips.length ? "once" : "none"; return Promise.resolve();
  }
  if(!fuelSupported()){ fuel.state = fuel.trips.length ? "once" : "unsupported"; return Promise.resolve(); }
  return idbDo("readonly", function(st){ return st.get("fuelFile"); }).then(function(h){
    if(!h){ fuel.state = fuel.trips.length ? "once" : "none"; return; }
    fuelHandle = h; fuel.via = "handle";
    return h.queryPermission({mode:"read"}).then(function(p){
      fuel.state = p === "granted" ? "ok" : "need-permission";
      if(p === "granted"){ startFuelTimer(); return refreshFuel(false); }
    });
  }).catch(function(){ fuel.state = "none"; });
}
window.addEventListener("focus", function(){ if(fuel.state === "ok") refreshFuel(false); });
document.addEventListener("visibilitychange", function(){ if(!document.hidden && fuel.state === "ok") refreshFuel(false); });

function renderFuelChip(){
  var c = document.getElementById("fuelChip"); if(!c) return;
  var txt, cls;
  if(fuel.state === "ok"){ txt = "⛽ Расход: " + fmtStamp(fuel.readAt); cls = fuel.error ? "warn" : "ok"; }
  else if(fuel.state === "need-permission"){ txt = "⛽ Разрешить доступ к расходу"; cls = "warn"; }
  else if(fuel.state === "once"){ txt = "⛽ Расход: разовый файл — подключите постоянно"; cls = "warn"; }
  else if(usingDemoFuel()){ txt = "⛽ Расход: демо-снимок (подключите файл)"; cls = "warn"; }
  else { txt = "⛽ Расход не подключён"; cls = ""; }
  c.textContent = txt; c.className = "backup-chip " + cls;
}

var MAILER_KEY = "pax-mailer", MAIL_DIR_KEY = "pax-mail-path";
var mailerPath = null;
function mailDesk(){ var d = window.paxDesktop; return (d && typeof d.openMail === "function") ? d : null; }
function mailInit(){
  var d = mailDesk(); if(!d) return Promise.resolve();
  try{ mailerPath = sget(MAILER_KEY) || null; }catch(e){}
  if(mailerPath) return Promise.resolve();
  return d.findMailer().then(function(p){
    if(p){ mailerPath = p; try{ sset(MAILER_KEY, p); }catch(e){} }
  }).catch(function(){});
}
function b64utf8(s){
  var b = new TextEncoder().encode(s), bin = "";
  for(var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin);
}
function ascii(s){ return !/[^\x00-\x7F]/.test(s); }
function encWord(s){ return ascii(s) ? s : "=?UTF-8?B?" + b64utf8(s) + "?="; }
function encAddr(a){
  var m = String(a).match(/^(.*?)\s*<([^>]+)>$/);
  if(!m) return String(a).trim();
  var n = m[1].replace(/^"|"$/g, "").trim();
  return (ascii(n) ? '"' + n + '"' : encWord(n)) + " <" + m[2].trim() + ">";
}
function encMail(a){ return encodeURIComponent(mailAddr(a)).replace(/%40/g, "@"); }
function mailtoUrl(r){
  var to = r.to.map(encMail).join(",");
  var cc = r.cc.map(encMail).join(",");
  return "mailto:" + to + "?cc=" + cc + "&subject=" + encodeURIComponent(r.subject) + "&body=" + encodeURIComponent(r.body);
}
function openMailReport(r){
  var url = mailtoUrl(r), d = mailDesk();
  if(!d){ try{ window.location.href = url; }catch(e){ notice("Не удалось открыть почтовую программу", true); } return Promise.resolve(); }
  return d.openMail(url, mailerPath).then(function(res){
    if(!res || !res.ok) throw new Error(res && res.error || "не удалось открыть письмо");
    toast("Письмо открыто в почте — проверьте и отправьте");
  }).catch(function(e){ notice("Письмо не открылось: " + (e && e.message || e), true); });
}
function mailDate(d){
  var D = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var off = -d.getTimezoneOffset(), sg = off < 0 ? "-" : "+";
  off = Math.abs(off);
  return D[d.getDay()] + ", " + pad2(d.getDate()) + " " + M[d.getMonth()] + " " + d.getFullYear() + " " +
    pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) + " " +
    sg + pad2(Math.floor(off / 60)) + pad2(off % 60);
}
function emlText(r){
  var from = 'ARCTICABORG <arcticaborg@ms65.ru>';
  var b64 = b64utf8(r.body.replace(/\n/g, "\r\n")), lines = [];
  for(var i = 0; i < b64.length; i += 76) lines.push(b64.slice(i, i + 76));
  var id = "<" + Date.now().toString(36) + "." + Math.random().toString(36).slice(2) + "@ms65.ru>";
  return [
    "From: " + encAddr(from),
    "To: " + r.to.map(encAddr).join(",\r\n\t"),
    "Cc: " + r.cc.map(encAddr).join(",\r\n\t"),
    "Subject: " + encWord(r.subject),
    "Date: " + mailDate(new Date()),
    "Message-ID: " + id,
    "X-Unsent: 1",
    "MIME-Version: 1.0",
    'Content-Type: text/plain; charset="utf-8"',
    "Content-Transfer-Encoding: base64",
    "",
    lines.join("\r\n"),
    ""
  ].join("\r\n");
}
function safeName(s){ return String(s).replace(/[\\\/:*?"<>|]/g, "-").replace(/\s+/g, " ").trim().slice(0, 90); }

/* ---------- Хронология для DRR ---------- */
function toMin(hm){ if(!hm) return null; var p = hm.split(":"); return +p[0]*60 + +p[1]; }
function fmtMin(m, start){ var d = ((m % 1440) + 1440) % 1440; return (m === 1440 && !start) ? "24:00" : pad2(Math.floor(d/60)) + ":" + pad2(d%60); }
function addDays(iso, n){ var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function buildChronology(c, t){
  var codes = c.codes, vis = fuelVisits(t), a = c.act, missing = [];
  var dep = t ? t.dep : "", arr = t ? t.arr : "";
  var lastPlat = codes.length ? codes[codes.length-1] : null;
  function mlsp(code){ return "МЛСП " + PLATFORM_NAMES[code]; }
  var ev = []; // {t:"HH:MM", key, text (что происходит ПОСЛЕ этой отметки)}
  function push(time, label, text){ if(time) ev.push({hm:time, text:text}); else missing.push(label); }
  var nextName = codes.length ? mlsp(codes[0]) : "п. Набиль";
  var cont = c.act.cargo === false ? [] : c.containers.map(function(x){ return x.no; }).filter(Boolean);
  if(cont.length) push(a.cargoFrom, "погрузка контейнеров — начало", "Стоим ошвартованные к причалу п.Набиль. Погрузка контейнеров " + cont.join(", ") + ". СДГ");
  if(cont.length) push(a.cargoTo, "погрузка контейнеров — конец", "Стоим ошвартованные к причалу п.Набиль. В ожидании ЗВОП. СДГ");
  push(a.boardFrom, "посадка ЗВОП — начало", "Стоим ошвартованные к причалу п.Набиль. Прибыл ЗВОП " + c.boarded + " чел. СДГ");
  push(a.boardTo, "посадка ЗВОП — конец (отшвартовка)", "Отошли от причала, следуем на " + nextName + ". ГД 1,2");
  push(dep, "отход из Набиля (файл расхода)", "Следуем по фарватеру на выход в море. ГД 1,2");
  push(a.chanOut, "выход из канала", "За 5 км зоной от платформы, следуем на " + nextName + ". ГД 1");
  codes.forEach(function(code, i){
    var v = vis[i] || {}, av = a.visits[i] || {}, nm = PLATFORM_NAMES[code];
    var after = i + 1 < codes.length ? "на " + mlsp(codes[i+1]) : "п. Набиль";
    var leaving = c.leftAt[i], coming = c.cameAt[i];
    var unload = cont.length && c.containers.some(function(x){ return x.to === code; }) && c.firstVisit[code] === i;
    push(av.zoneIn, nm + ": вход в 5 км зону", "В 5 км зоны от платформы, следуем на " + mlsp(code) + ". ГД 1,2");
    // если людей на платформе не было — про фроговые операции не пишем вообще
    var frog = (num(leaving) + num(coming)) > 0 ? " Фроговые операции: покинуло " + num(leaving) + " чел / Прибыло " + num(coming) + " чел / с багажом." : "";
    push(v.arr, nm + ": подход (файл расхода)", "В 500 м зоны от платформы." + (unload ? " Выгрузка контейнеров." : "") + frog + " ГД 1,2");
    push(v.dep, nm + ": отход (файл расхода)", "В 5 км зоны от платформы, следуем " + after + ". ГД 1,2");
    push(av.zoneOut, nm + ": выход из 5 км зоны", "За 5 км зоной от платформы, следуем " + after + ". " + (i + 1 < codes.length ? "ГД 1,2" : "ГД 1"));
  });
  push(a.chanIn, "вход в канал", "Следуем по фарватеру на вход в порт Набиль. ГД 1,2");
  push(a.moor, "швартовка", "Швартовка к причалу порта Набиль. ГД 1,2");
  push(arr, "приход в Набиль (файл расхода)", "Ошвартованные к причалу п.Набиль. Убыл ЗВОП " + c.landed + " чел. ГД 1,2");
  push(a.disembark, "высадка ЗВОП — конец", "Стоим ошвартованные к причалу п.Набиль. СДГ");
  // превращаем в минуты с переходом через полночь
  var prev = null, bad = [];
  ev.forEach(function(e){
    var m = toMin(e.hm);
    if(prev !== null && m < prev){ if(prev - m > 600) m += 1440; else bad.push(e.hm); }
    e.m = m; prev = m;
  });
  var start = 360, end = 1440 + 360, rows = [];
  var cursor = start, text = "Стоим ошвартованные к причалу п.Набиль. СДГ";
  ev.forEach(function(e){ if(e.m > cursor){ rows.push({from:cursor, to:e.m, text:text}); } cursor = Math.max(cursor, e.m); text = e.text; });
  if(cursor < end) rows.push({from:cursor, to:end, text:text});
  // разрезаем по полуночи
  var out = [], day2 = false;
  rows.forEach(function(r){
    if(r.from < 1440 && r.to > 1440){ out.push({from:r.from, to:1440, text:r.text}); out.push({split:true}); out.push({from:1440, to:r.to, text:r.text}); day2 = true; }
    else { if(r.from >= 1440 && !day2){ out.push({split:true}); day2 = true; } out.push(r); }
  });
  if(!day2) out.push({split:true}, {from:1440, to:end, text:"Стоим ошвартованные к причалу п.Набиль. СДГ"});
  return {drrDate: addDays(c.date, 1), rows: out, missing: missing, bad: bad};
}

/* ---------- Контекст карточки из записи (для DRR) ---------- */
function initVisitPax(c){
  // люди по заходам: из карточки, а для старых записей — всё на первый заход платформы
  c.vnp = []; c.vpn = []; var seen = {};
  c.codes.forEach(function(code, i){
    var av = c.act.visits[i] || {}, first = !seen[code]; seen[code] = true;
    c.vnp[i] = "np" in av ? av.np : (first ? c.np[code] : "");
    c.vpn[i] = "pn" in av ? av.pn : (first ? c.pn[code] : "");
  });
}
function derivePax(c){
  c.boarded = 0; c.landed = 0; c.leftAt = []; c.cameAt = []; c.firstVisit = {}; c.xferBad = [];
  c.vnp = c.vnp || []; c.vpn = c.vpn || [];
  c.codes.forEach(function(code, i){ if(c.firstVisit[code] === undefined) c.firstVisit[code] = i; });
  var tot = {np:{ORL:0, BER:0}, pn:{ORL:0, BER:0}, anyNp:{}, anyPn:{}};
  c.codes.forEach(function(code, i){
    tot.np[code] += num(c.vnp[i]); tot.pn[code] += num(c.vpn[i]);
    if(!blank(c.vnp[i]) && c.vnp[i] !== "") tot.anyNp[code] = true;
    if(!blank(c.vpn[i]) && c.vpn[i] !== "") tot.anyPn[code] = true;
    c.leftAt[i] = num(c.vnp[i]); c.cameAt[i] = num(c.vpn[i]);
  });
  ["ORL","BER"].forEach(function(k){ c.np[k] = tot.anyNp[k] ? tot.np[k] : ""; c.pn[k] = tot.anyPn[k] ? tot.pn[k] : ""; c.boarded += tot.np[k]; c.landed += tot.pn[k]; });
  // пересадки: забираем на ближайшем заходе «откуда», у которого дальше есть заход «куда»
  [["ORL","BER", num(c.o2b), "с Орлана на Беркут"], ["BER","ORL", num(c.b2o), "с Беркута на Орлан"]].forEach(function(x){
    if(!x[2]) return;
    for(var i = 0; i < c.codes.length; i++){
      if(c.codes[i] !== x[0]) continue;
      for(var j = i + 1; j < c.codes.length; j++) if(c.codes[j] === x[1]){ c.cameAt[i] += x[2]; c.leftAt[j] += x[2]; return; }
    }
    c.xferBad.push(x[3]);
  });
  return c;
}
function cardCtx(r, trip){

    np: {ORL: r ? r.npOrlan : "", BER: r ? r.npBerkut : ""}, pn: {ORL: r ? r.pnOrlan : "", BER: r ? r.pnBerkut : ""},
    o2b: r ? r.trO2B : "", b2o: r ? r.trB2O : "", containers: r ? clone(r.containers) : []};

  if($("cFull")) $("cFull").onclick = function(){ close(); openForm(existing.id); };
  $("cSave").onclick = function(){
    // сначала спросим общий файл: не правил ли кто этот рейс на другом компьютере
    if(existing && typeof recUpdInShared === "function" && typeof syncDir !== "undefined" && syncDir){
      var btn = this;
      btn.disabled = true;
      recUpdInShared(existing.id).then(function(u){
        btn.disabled = false;
        if(u !== null && u > openedUpd){
          if(!confirm("Этот рейс изменили на другом компьютере " + new Date(u).toLocaleString("ru-RU") + ",\nуже после того как вы открыли карточку.\n\nСохранить свою версию поверх?\n(Отмена — закройте карточку и откройте заново, чтобы увидеть чужие правки.)")) return;
        }
        doSave();
      }, function(){ btn.disabled = false; doSave(); });
      return;
    }
    doSave();
  };
  function doSave(){
    try{
      if(!c.codes.length) throw new Error("Выберите маршрут: + Орлан / + Беркут.");
      var si = stashInfo();
      if(si.visits.length || si.conts.length){
        var msg = "В маршруте нет платформ, по которым уже есть данные:\n" + si.visits.concat(si.conts).map(function(x){ return "• " + x; }).join("\n") +
          "\n\nЭти данные НЕ попадут в рейс. Сохранить так?\n(Отмена — вернуться и добавить платформу в маршрут, данные вернутся сами.)";
        if(!confirm(msg)) return;
      }
      var o = existing ? clone(existing) : blankRecord(c.date);
      o.date = c.date; o.no = $("cNo").value.trim(); o.route = ["NAB"].concat(c.codes).join("-");
      if(trip){ o.dep = trip.dep; o.arr = trip.arr; }
      o.npOrlan = c.np.ORL; o.npBerkut = c.np.BER; o.pnOrlan = c.pn.ORL; o.pnBerkut = c.pn.BER; o.trO2B = c.o2b; o.trB2O = c.b2o;
      o.containers = !c.act.cargo ? [] : c.containers.filter(function(x){ return x.no; }).map(function(x){ return {no:x.no, to:x.to, w:x.w || ""}; });
      if(o.gruzAuto !== false) o.gruzAuto = true;
      o.note = $("cNote").value.trim();
      derivePax(c);
      o.npOrlan = c.np.ORL; o.npBerkut = c.np.BER; o.pnOrlan = c.pn.ORL; o.pnBerkut = c.pn.BER;
      c.act.visits.length = c.codes.length;
      c.act.visits.forEach(function(av, i){ av.np = blank(c.vnp[i]) ? "" : c.vnp[i]; av.pn = blank(c.vpn[i]) ? "" : c.vpn[i]; });
      o.act = c.act;
      var n = normalizeRecord(o, "");
      var next = clone(state.data), idx = next.records.findIndex(function(x){ return x.id === n.id; });
      if(idx >= 0) next.records[idx] = n; else next.records.push(n);
      if(commit(next, existing ? "Рейс сохранён" : "Рейс добавлен")){ state.month = monthKey(n.date); renderAll(); close(); }
      else $("cErr").textContent = "Не сохранено — см. сообщение вверху страницы.";
    }catch(e){ $("cErr").textContent = e.message; }
  }
  render();
}

  return s ? s : "";   // ноль в справке не пишем, как в бумажном образце
}
function callsRows(mk){
  return state.data.records.filter(function(r){ return monthKey(r.date) === mk; })
    .map(function(r, i){
      return {n: i + 1, date: isoSerial(r.date), dep: timeFrac(r.dep), arr: timeFrac(r.arr),
        route: routeWords(r), cargo: cargoT(r), out: paxSum(r.npOrlan, r.npBerkut), back: paxSum(r.pnOrlan, r.pnBerkut)};
    });
}
function lastDay(mk){ return daysIn(+mk.slice(0, 4), +mk.slice(5, 7)); }
function callsFileName(mk){
  var d = lastDay(mk), m = mk.slice(5, 7), y = mk.slice(0, 4);
  return "Судозаходы 01." + m + "." + y + " - " + pad2(d) + "." + m + "." + y + ".xlsx";
}
// месяц файла — по первой дате в колонке B
function callsFileMonth(xml, sst){
  for(var n = 7; n <= 60; n++){
    var v = readCells(xml, sst, ["B" + n])["B" + n];
    if(typeof v === "number" && v > 30000) return serialIso(Math.round(v)).slice(0, 7);
  }
  return null;
}
function fillCalls(buf, mk){
  var rows = callsRows(mk);
  return openXlsx(buf).then(function(o){
    var z = o.z, sn = o.sheets[Object.keys(o.sheets)[0]];
    return Promise.all([Promise.all(z.names.map(function(n){ return z.bytes(n).then(function(b){ return {name:n, data:b}; }); })), loadSst(z)]).then(function(res){
      var files = res[0], sst = res[1], dec = new TextDecoder();
      function text(n){ var f = files.find(function(x){ return x.name === n; }); return f ? dec.decode(f.data) : null; }
      function put(n, s){ var f = files.find(function(x){ return x.name === n; }); if(f) f.data = s; }
      var xml = text(sn);
      if(!xml) throw new Error("не удалось прочитать лист справки");
      var fileMk = callsFileMonth(xml, sst);
      var FIRST = 7, BASE_LAST = 24, SUM_ROW = 25;
      // сколько строк не хватает
      var need = Math.max(0, rows.length - (BASE_LAST - FIRST + 1)), delta = need;
      if(delta > 0) xml = callsInsertRows(xml, BASE_LAST, SUM_ROW, delta);
      var last = BASE_LAST + delta;
      // значения
      rows.forEach(function(r, i){
        var n = FIRST + i;
        xml = setCell(xml, "A" + n, r.n);
        xml = setCell(xml, "B" + n, r.date);
        xml = setCell(xml, "C" + n, r.dep);
        xml = setCell(xml, "D" + n, r.route);
        xml = setCell(xml, "E" + n, r.cargo);
        xml = setCell(xml, "F" + n, r.out);
        xml = setCell(xml, "G" + n, r.arr);
        xml = setCell(xml, "H" + n, r.route);
        xml = setCell(xml, "I" + n, null);
        xml = setCell(xml, "J" + n, r.back);
      });
      // лишние строки чистим, номера в А оставляем
      for(var n2 = FIRST + rows.length; n2 <= last; n2++){
        xml = setCell(xml, "A" + n2, n2 - FIRST + 1);
        ["B","C","D","E","F","G","H","I","J"].forEach(function(c){ xml = setCell(xml, c + n2, null); });
      }
      // шапка и дата подписи
      var y = mk.slice(0, 4), m = +mk.slice(5, 7), d = lastDay(mk);
      xml = setCell(xml, "D3", "С 01 по " + pad2(d) + " " + MONTHS_GEN[m - 1] + " " + y + "г");
      var sig = readCells(xml, sst, ["C29"]).C29;
      xml = setCell(xml, "C" + (29 + delta), " Капитан:  __________________ " + pad2(d) + "." + pad2(m) + "." + y + " г. ");
      put(sn, xml);
      var wb = text("xl/workbook.xml");
      if(wb) put("xl/workbook.xml", wb.replace(/<calcPr([^>]*?)\/>/, function(a, at){ return '<calcPr' + at.replace(/\sfullCalcOnLoad="[^"]*"/, "") + ' fullCalcOnLoad="1"/>'; }));
      files = files.filter(function(f){ return f.name !== "xl/calcChain.xml"; });
      var ct = text("[Content_Types].xml"); if(ct) put("[Content_Types].xml", ct.replace(/<Override PartName="\/xl\/calcChain\.xml"[^>]*\/>/, ""));
      var rl = text("xl/_rels/workbook.xml.rels"); if(rl) put("xl/_rels/workbook.xml.rels", rl.replace(/<Relationship [^>]*Target="calcChain\.xml"[^>]*\/>/, ""));
      return {blob: zip(files), rows: rows.length, added: delta, fileMonth: fileMk};
    });
  });
}
// вставка пустых строк-клонов перед «ИТОГО» + сдвиг всего, что ниже
function callsInsertRows(xml, baseLast, sumRow, delta){
  var rowRe = /<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g, rows = [], m;
  while((m = rowRe.exec(xml))) rows.push({n:+m[1], x:m[0]});
  var tpl = rows.filter(function(r){ return r.n === baseLast; })[0];
  if(!tpl) throw new Error("в шаблоне нет строки " + baseLast);
  function renum(x, n){ return x.replace(/<row r="\d+"/, '<row r="' + n + '"').replace(/(<c r="[A-Z]+)\d+"/g, '$1' + n + '"'); }
  function clearVals(x){ return x.replace(/<c r="([A-Z]+\d+)"(\s[^>]*?)?(?:\/>|>[\s\S]*?<\/c>)/g, function(all, ref, attrs){ var st = (attrs || "").match(/\bs="(\d+)"/); return cellXml(ref, st ? st[1] : "", null); }); }
  // сдвигаем строки ниже baseLast
  var moved = [];
  rows.forEach(function(r){ if(r.n > baseLast) moved.push({from:r.n, to:r.n + delta, x:renum(r.x, r.n + delta)}); });
  moved.slice().reverse().forEach(function(r){ xml = xml.replace(rows.filter(function(q){ return q.n === r.from; })[0].x, r.x); });
  // новые строки
  var add = "";
  for(var i = 1; i <= delta; i++) add += clearVals(renum(tpl.x, baseLast + i));
  xml = xml.replace(tpl.x, tpl.x + add);
  // объединения ниже
  xml = xml.replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g, function(all, c1, r1, c2, r2){
    if(+r1 > baseLast) return '<mergeCell ref="' + c1 + (+r1 + delta) + ":" + c2 + (+r2 + delta) + '"/>';
    return all;
  });
  // формулы сумм F7:F24 → F7:F(24+delta)
  function shiftRef(c, r){ return c + (+r > baseLast ? +r + delta : +r); }
  xml = xml.replace(/<f>([^<]*)<\/f>/g, function(all, f){
    // диапазоны и одиночные ссылки разбираем раздельно, чтобы не сдвинуть дважды
    var nf = f.split(/([A-Z]+\d+:[A-Z]+\d+)/).map(function(part, i){
      if(i % 2){
        var m2 = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(part);
        var a = +m2[2] > baseLast ? +m2[2] + delta : +m2[2];
        var b = +m2[4] >= baseLast ? +m2[4] + delta : +m2[4];   // конец диапазона тянем вместе с новыми строками
        return m2[1] + a + ":" + m2[3] + b;
      }
      return part.replace(/\b([A-Z]+)(\d+)\b/g, function(a3, c, r){ return shiftRef(c, r); });
    }).join("");
    return "<f>" + nf + "</f>";
  });
  return xml;
}
function callsFill(){
  var d = callsDesk();
  if(!d){ notice("Работает в программе (десктоп).", true); return; }
  var mk = state.month || todayISO().slice(0, 7);
  if(!callsRows(mk).length){ notice("За " + monthLabel(mk) + " в журнале нет рейсов.", true); return; }
  var last = ""; try{ last = sget(CALLS_PATH_KEY) || ""; }catch(e){}
  var path = "", name = "", B = busy("Справка о судозаходах");
  B.step("выберите файл справки…");
  return d.pickFile({title:"Выберите файл справки о судозаходах (он должен быть закрыт в Excel)", defaultPath: last}).then(function(p){
    if(!p) return null;
    path = p; try{ sset(CALLS_PATH_KEY, p); }catch(e){}
    B.step("читаю файл…", 20);
    return d.readFile(p);
  }).then(function(r){
    if(!r) return null;
    name = r.name;
    B.step("заполняю рейсы за " + monthLabel(mk) + "…", 45);
    var buf = r.data && r.data.buffer ? r.data.buffer : r.data;
    return fillCalls(buf, mk);
  }).then(function(res){
    if(!res){ B.close(); return null; }
    var target = path;
    if(res.fileMonth && res.fileMonth !== mk){
      var nf = callsFileName(mk);
      if(!confirm("В файле «" + name + "» рейсы за " + monthLabel(res.fileMonth) + ",\nа в журнале открыт " + monthLabel(mk) + ".\n\nСоздать рядом новый файл «" + nf + "»?\n(Отмена — ничего не делаем.)")){ B.close(); return null; }
      target = deskJoin(path.replace(/[\\\/][^\\\/]*$/, ""), nf);
    }
    B.step("записываю файл…", 80);
    return res.blob.arrayBuffer().then(function(ab){
      return d.writeFile(target, new Uint8Array(ab)).then(function(w){
        if(!w || !w.ok) throw new Error((w && w.error) || "не удалось записать файл");
        B.done("рейсов " + res.rows + (res.added ? ", добавлено строк " + res.added : "") + " · " + target);
        toast("Справка заполнена: рейсов " + res.rows);
      });
    });
  }).catch(function(e){
    var m = e && e.message || String(e);
    if(/занят|busy|EBUSY/i.test(m)) m = "файл открыт в Excel — закройте его и повторите";
    B.fail(m);
    notice("Справка: " + m, true);
  });
}
try{ window.__callsTest = function(b64, mk){
  var bin = atob(b64), u = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return fillCalls(u.buffer, mk).then(function(r){
    return r.blob.arrayBuffer().then(function(ab){
      var x = new Uint8Array(ab), s = "";
      for(var j = 0; j < x.length; j++) s += String.fromCharCode(x[j]);
      return {b64: btoa(s), rows: r.rows, added: r.added, fileMonth: r.fileMonth};
    });
  });
}; }catch(e){}
})();
